basePath: /v1
definitions:
  main.CreateUserTokenPayload:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 3
        type: string
    required:
    - email
    - password
    type: object
  main.RegisterUserPayload:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - email
    - password
    - username
    type: object
  main.UserWithToken:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      token:
        type: string
      username:
        type: string
    type: object
  main.createTaskPayload:
    properties:
      is_optional:
        type: boolean
      tier:
        enum:
        - 0
        - 1
        - 2
        type: integer
      title:
        maxLength: 160
        minLength: 1
        type: string
    required:
    - title
    type: object
  store.Task:
    properties:
      completions_count:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      is_completed:
        type: boolean
      is_optional:
        type: boolean
      tier:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  store.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      username:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for SquaresMyBeloved, a web app to track productivity
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: SquaresMyBeloved API
paths:
  /auth/activate/{token}:
    get:
      description: Activates a user account using the activation token
      parameters:
      - description: Activation token
        in: path
        name: token
        required: true
        type: string
      responses:
        "204":
          description: Account activated successfully
        "400":
          description: Invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Token not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Activate user account
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns an activation token
      parameters:
      - description: Registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: User created with activation token
          schema:
            $ref: '#/definitions/main.UserWithToken'
        "400":
          description: Invalid request/duplicate email or username
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: Generates a JWT token for authenticated users
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateUserTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Token
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Create authentication token
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: Returns the current health status of the application along with
        environment and version information
      produces:
      - application/json
      responses:
        "200":
          description: Returns application health status
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: When there's a server error while generating the response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check endpoint
      tags:
      - health
  /tasks:
    post:
      consumes:
      - application/json
      description: Create several tasks with a single request
      parameters:
      - description: List of tasks to create
        in: body
        name: tasks
        required: true
        schema:
          items:
            $ref: '#/definitions/main.createTaskPayload'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created tasks with count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create multiple tasks in a batch
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Get task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: The requested task
          schema:
            $ref: '#/definitions/store.Task'
        "404":
          description: Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get a specific task
      tags:
      - tasks
  /tasks/{id}/complete:
    patch:
      description: Mark a task as completed
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No content
        "404":
          description: Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Complete a task
      tags:
      - tasks
  /users/{userID}:
    get:
      description: Get a user's information by ID
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            $ref: '#/definitions/store.User'
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user details
      tags:
      - users
  /users/{userID}/tasks:
    get:
      consumes:
      - application/json
      description: Get paginated and filtered list of tasks for the specified user
        ID
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - default: 100
        description: Results limit (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Date filter (today/yesterday/YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Filter by completion status
        in: query
        name: completed
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Tasks returned successfully
        "400":
          description: Invalid request parameters
        "500":
          description: Server error
      security:
      - ApiKeyAuth: []
      summary: List tasks for a specific user
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
